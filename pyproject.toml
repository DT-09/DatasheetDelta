[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheetdelta"
version = "0.1.0.dev0"
description = "Evidence-first engineering specification revision comparison"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]
documents = [
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
]
e2e = ["playwright>=1.50"]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
datasheetdelta = "datasheetdelta.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["datasheetdelta*"]
