name: tests

on:
  push:
    branches: [main, release-engineering, release-validation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: pip install -e ".[all]"
      - name: Run test suite
        run: pytest

  e2e:
    runs-on: ubuntu-latest
    env:
      DATASHEETDELTA_ACCESS_TOKEN: ci-review-token
      DATASHEETDELTA_DB: ${{ runner.temp }}/datasheetdelta-e2e.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser-test dependencies
        run: |
          pip install -e ".[all,e2e]"
          playwright install --with-deps chromium
      - name: Start application
        run: |
          uvicorn datasheetdelta.api:app --host 127.0.0.1 --port 8000 > /tmp/datasheetdelta.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/datasheetdelta.log
          exit 1
      - name: Run browser acceptance test
        run: pytest e2e -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag datasheetdelta:ci .
