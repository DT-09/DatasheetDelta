services:
  - type: web
    name: datasheetdelta-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api,documents]"
    startCommand: uvicorn datasheetdelta.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://datasheetdelta.pages.dev
